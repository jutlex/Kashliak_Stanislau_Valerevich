<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="fonts/stylesheet.css">
</head>
<body>
    <div class="header">
        <div class="header_top">
            <img class="logo" src="img/logo.png" alt="logo">
            <div class="header-left">
                <div class="town">
                    <p class="msk">
                        <img class="marker-gold" src="img/Vector_gold.png" alt="marker-gold">
                        москва
                    </p>
                    <img class="line" src="img/Line 3.png" alt="line">
                    <p class="dub">
                        <img class="marker" src="img/Vector.png" alt="marker">
                        дубай
                    </p>


                </div>
                <div class="navigation">
                    <a class="href1" href="#">Подобрать авто</a>
                    <a class="href2" href="#">Условия</a>
                    <a class="href3" href="#">Цены</a>
                    <a class="href4" href="#">О нас</a>
                    <a class="href5" href="#">Контакты</a>

                </div>
                <div class="contacts">
                    <img class="whatsup" src="img/whatsup.png" alt="whatsup">
                    <img class="tg" src="img/tg.png" alt="tg">
                    <h2 class="number">+7 (499) 110-20-47</h2>
                    

                </div>
                <button class="btn">Заказать звонок</button>
               
            </div>
            <div class="header-right">
                <a class="header-right-img-car" href="#"><img src="img/car-marker.png" alt="car-marker"></a>
                <a class="header-right-img-profile" href="#"><img src="img/profile-marker.png" alt="profile-marker"></a>

            </div>
            

        </div>

    </div>
    <div class="main">
        <div class="main-face">
            <div class="container">
                <div>
                    <h1 class="main-text">Аренда авто <br> в Москве</h1>
                    <h4 class="main-side-text">Прокат или аренда автомобиля с водителем и без</h4>
                    <img class="main-line" src="img/main-line.png" alt="">
                </div>
                <div class="advantages">
                    <div class="advantage-1"><img class="advantage-1-img" src="img/1.jpg" alt=""><h5>Большой парк <br> автомобилей в наличии</h5></div>
                    <div class="advantage-2"><img class="advantage-2-img" src="img/2.jpg" alt=""><h5>Доставка авто <br> до вашей локации</h5></div>
                    <div class="advantage-3"><img class="advantage-3-img" src="img/3.jpg" alt=""><h5>Скидки постоянным <br> клиентам</h5></div>
                    <div class="advantage-4"><img class="advantage-4-img" src="img/4.jpg" alt=""><h5>Любая форма <br> оплаты</h5></div>
                    <div class="advantage-5"><img class="advantage-5-img" src="img/5.jpg" alt=""><h5>Выгодные цены </h5></div>

                </div>
                

            </div>

        </div>

    </div>
</body>
</html>
