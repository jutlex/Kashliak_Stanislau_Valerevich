    var gender=confirm('Ваш пол - мужской? ')
    var genderText= (gender) ? 'мужской' : 'женский';
    var pensionText= (age>58 & gender==false || age>63 ) ? 'да' : 'нет' 
    var anketa = 'Ваше ФИО: ' + lName + ' ' + fName+ ' ' + patronymic + '\n' +
                 'Ваш возраст в годах: ' + age + '\n' +
                 'Ваш возраст в днях: ' + age*365 + '\n' +
                 'Через 5 лет вам будет: ' + (parseInt(age) + 5) + '\n' +
                 'Ваш пол: ' + genderText + '\n' +
                 'Вы на пенсии: ' + pensionText
    alert(anketa);
</script>
